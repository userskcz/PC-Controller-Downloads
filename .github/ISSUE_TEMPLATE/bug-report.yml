name: Bug report / Повідомити про помилку
description: Report an issue with PC Server or its connection to the watch.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please do not post API keys, passwords, tokens or private files. Не публікуйте ключі, паролі, токени чи приватні файли."
  - type: input
    id: server-version
    attributes:
      label: PC Server version / Версія сервера
    validations:
      required: true
  - type: input
    id: watch
    attributes:
      label: Watch model and Wear OS / Модель годинника та Wear OS
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / Кроки відтворення
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details / Додаткова інформація
      description: Windows version and relevant logs with secrets removed.
